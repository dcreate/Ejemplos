<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Datos de tarjeta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .dato {
      margin-top: 20px;
      text-align: left;
    }

    .etiqueta {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #777;
      font-weight: bold;
    }

    .valor {
      padding: 16px 12px;
      background: #f5f5f5;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-word;
      text-align: center;
    }

    /* =========================
       BOTÓN
       ========================= */

    .boton {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
    }

    .boton:hover {
      background: #444;
      box-shadow: 0 5px 15px rgba(0,0,0,.2);
    }

    .boton:active {
      transform: scale(0.94);
    }

    /* Animación al copiar */

    .boton.copiado {
      background: #198754;
      animation: copiar 0.45s ease;
    }

    @keyframes copiar {

      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.08);
      }

      70% {
        transform: scale(0.96);
      }

      100% {
        transform: scale(1);
      }

    }

    #mensaje {
      margin-top: 15px;
      min-height: 20px;
      color: #198754;
      font-weight: bold;
    }

    /* =========================
       QR
       ========================= */

    .qr {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .qr h3 {
      margin-bottom: 15px;
    }

    .qr img {
      width: 220px;
      height: 220px;
      max-width: 100%;
      border-radius: 10px;
    }

    .aviso {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>💳 Datos de tarjeta</h1>


    <!-- =========================
         TITULAR
         ========================= -->

    <div class="dato">

      <span class="etiqueta">
        TITULAR
      </span>

      <div class="valor" id="titular">
        Cargando...
      </div>

      <button
        class="boton"
        id="botonTitular"
        onclick="copiarDato('titular', 'botonTitular', 'Titular copiado')">

        📋 Copiar nombre

      </button>

    </div>


    <!-- =========================
         TARJETA
         ========================= -->

    <div class="dato">

      <span class="etiqueta">
        NÚMERO DE TARJETA
      </span>

      <div class="valor" id="numero">
        Cargando...
      </div>

      <button
        class="boton"
        id="botonTarjeta"
        onclick="copiarDato('numero', 'botonTarjeta', 'Número copiado')">

        📋 Copiar número

      </button>

    </div>


    <div id="mensaje"></div>


    <!-- =========================
         QR
         ========================= -->

    <div class="qr">

      <h3>📱 Escanea el código QR</h3>

      <img
        id="qrImagen"
        alt="Código QR">

    </div>


    <div class="aviso">
      Mantén esta información privada y compártela
      únicamente con personas de confianza.
    </div>

  </div>


  <script>

    // ==================================================
    // DATOS
    // ==================================================

    const CARD_NUMBER = "PON_AQUI_EL_NUMERO_DE_TARJETA";

    const CARD_OWNER = "PON_AQUI_EL_NOMBRE_DEL_TITULAR";


    // ==================================================
    // MOSTRAR DATOS
    // ==================================================

    function formatearNumero(numero) {

      return numero
        .replace(/\D/g, '')
        .replace(/(.{4})/g, '$1 ')
        .trim();

    }


    document.getElementById("titular").textContent =
      CARD_OWNER;


    document.getElementById("numero").textContent =
      formatearNumero(CARD_NUMBER);


    // ==================================================
    // COPIAR AL PORTAPAPELES
    // ==================================================

    async function copiarDato(elemento, boton, mensaje) {

      let texto;

      if (elemento === "titular") {

        texto = CARD_OWNER;

      } else {

        texto = CARD_NUMBER;

      }


      try {

        await navigator.clipboard.writeText(texto);

      } catch (error) {

        // Método alternativo

        const textarea =
          document.createElement("textarea");

        textarea.value = texto;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

      }


      // Animación

      const botonElemento =
        document.getElementById(boton);

      botonElemento.classList.add("copiado");


      const textoOriginal =
        botonElemento.innerHTML;


      botonElemento.innerHTML =
        "✓ ¡Copiado!";


      document.getElementById("mensaje").textContent =
        mensaje;


      // Regresar botón a su estado normal

      setTimeout(() => {

        botonElemento.classList.remove("copiado");

        botonElemento.innerHTML =
          textoOriginal;

        document.getElementById("mensaje").textContent =
          "";

      }, 1800);

    }


    // ==================================================
    // GENERAR QR
    // ==================================================

    const paginaActual =
      window.location.href;


    const qrURL =
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
      + encodeURIComponent(paginaActual);


    document.getElementById("qrImagen").src =
      qrURL;

  </script>

</body>
</html>
