<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Datos de pago</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: Arial, sans-serif;

  background: #f2f2f2;

  padding: 20px;
}


/* TARJETA PRINCIPAL */

.card {
  width: 100%;
  max-width: 400px;

  background: white;

  padding: 30px 25px;

  border-radius: 20px;

  text-align: center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.15);
}


h1 {
  margin-top: 0;
  font-size: 24px;
}


/* SELECTOR */

.selector-container {
  margin-top: 20px;
  text-align: left;
}

.selector-container label {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;

  color: #777;

  font-weight: bold;
}

select {
  width: 100%;

  padding: 14px;

  border-radius: 12px;

  border: 1px solid #ddd;

  background: white;

  font-size: 16px;

  cursor: pointer;

  outline: none;

  transition: .3s;
}

select:focus {
  border-color: #222;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.08);
}


/* DATOS */

.dato {
  margin-top: 20px;

  text-align: left;
}

.etiqueta {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;

  color: #777;

  font-weight: bold;
}

.valor {
  padding: 16px 12px;

  background: #f5f5f5;

  border-radius: 12px;

  font-size: 18px;

  font-weight: bold;

  letter-spacing: 1px;

  word-break: break-word;

  text-align: center;
}


/* BOTONES */

.boton {
  position: relative;

  overflow: hidden;

  width: 100%;

  margin-top: 10px;

  padding: 14px;

  border: none;

  border-radius: 12px;

  background: #222;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .3s ease,
    box-shadow .3s ease;
}

.boton:hover {
  background: #333;

  transform: translateY(-2px);

  box-shadow:
    0 6px 18px rgba(0,0,0,.20);
}

.boton:active {
  transform: scale(.94);
}


/* EFECTO ONDA */

.boton::after {
  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  left: 50%;
  top: 50%;

  border-radius: 50%;

  background: rgba(255,255,255,.45);

  transform:
    translate(-50%, -50%)
    scale(0);

  opacity: 0;
}

.boton.animando::after {
  animation: onda .6s ease-out;
}

@keyframes onda {

  0% {
    transform:
      translate(-50%, -50%)
      scale(0);

    opacity: .7;
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(35);

    opacity: 0;
  }

}


/* ESTADO COPIADO */

.boton.copiado {

  background: #198754;

  animation: copiado .5s ease;
}

@keyframes copiado {

  0% {
    transform: scale(1);
  }

  35% {
    transform: scale(1.08);
  }

  65% {
    transform: scale(.96);
  }

  100% {
    transform: scale(1);
  }

}


/* MENSAJE */

#mensaje {
  margin-top: 15px;

  min-height: 20px;

  color: #198754;

  font-weight: bold;
}


/* QR */

.qr {

  margin-top: 30px;

  padding-top: 20px;

  border-top: 1px solid #eee;
}

.qr h3 {
  margin-bottom: 15px;
}

.qr img {

  width: 220px;
  height: 220px;

  max-width: 100%;

  border-radius: 10px;
}


/* AVISO */

.aviso {

  margin-top: 20px;

  font-size: 12px;

  color: #777;

  line-height: 1.5;
}

</style>
</head>


<body>


<div class="card">

  <h1>💳 Datos de pago</h1>


  <!-- SELECTOR DE BANCO -->

  <div class="selector-container">

    <label for="selectorTarjeta">
      SELECCIONA EL BANCO
    </label>

    <select
      id="selectorTarjeta"
      onchange="cambiarTarjeta()">

      <option value="tarjeta1">
        Banco 1
      </option>

      <option value="tarjeta2">
        Banco 2
      </option>

      <option value="tarjeta3">
        Banco 3
      </option>

    </select>

  </div>


  <!-- BANCO -->

  <div class="dato">

    <span class="etiqueta">
      BANCO
    </span>

    <div
      class="valor"
      id="banco">

      Banco 1

    </div>

  </div>


  <!-- TITULAR -->

  <div class="dato">

    <span class="etiqueta">
      TITULAR
    </span>

    <div
      class="valor"
      id="titular">

      NOMBRE DEL TITULAR

    </div>


    <button
      class="boton"
      id="botonTitular"
      onclick="copiarDato('titular','botonTitular')">

      📋 Copiar nombre

    </button>

  </div>


  <!-- TARJETA -->

  <div class="dato">

    <span class="etiqueta">
      NÚMERO DE TARJETA
    </span>

    <div
      class="valor"
      id="numero">

      0000 0000 0000 0000

    </div>


    <button
      class="boton"
      id="botonTarjeta"
      onclick="copiarDato('numero','botonTarjeta')">

      📋 Copiar número

    </button>

  </div>


  <div id="mensaje"></div>


  <!-- QR -->

  <div class="qr">

    <h3>
      📱 Escanea el código QR
    </h3>

    <img
      id="qrImagen"
      alt="Código QR">

  </div>


  <div class="aviso">

    Mantén esta información privada y
    compártela únicamente con personas
    de confianza.

  </div>


</div>


<script>


/* ==========================================
   TARJETAS
   ========================================== */

const tarjetas = {

  tarjeta1: {

    banco: "Banco 1",

    numero: "0000000000000000",

    titular: "NOMBRE DEL TITULAR"

  },


  tarjeta2: {

    banco: "Banco 2",

    numero: "1111111111111111",

    titular: "NOMBRE DEL TITULAR"

  },


  tarjeta3: {

    banco: "Banco 3",

    numero: "2222222222222222",

    titular: "NOMBRE DEL TITULAR"

  }

};


/* ==========================================
   TARJETA ACTUAL
   ========================================== */

let tarjetaActual = "tarjeta1";


/* ==========================================
   FORMATEAR TARJETA
   ========================================== */

function formatearNumero(numero) {

  return numero
    .replace(/\D/g, '')
    .replace(/(.{4})/g, '$1 ')
    .trim();

}


/* ==========================================
   CAMBIAR BANCO
   ========================================== */

function cambiarTarjeta() {

  tarjetaActual =
    document.getElementById(
      "selectorTarjeta"
    ).value;


  const tarjeta =
    tarjetas[tarjetaActual];


  document.getElementById("banco")
    .textContent =
    tarjeta.banco;


  document.getElementById("titular")
    .textContent =
    tarjeta.titular;


  document.getElementById("numero")
    .textContent =
    formatearNumero(
      tarjeta.numero
    );


  /* Actualizar QR */

  generarQR();

}


/* ==========================================
   COPIAR
   ========================================== */

async function copiarDato(
  elemento,
  boton
) {

  const tarjeta =
    tarjetas[tarjetaActual];


  let texto;


  if (elemento === "titular") {

    texto = tarjeta.titular;

  } else {

    texto = tarjeta.numero;

  }


  try {

    await navigator.clipboard
      .writeText(texto);

  }

  catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value = texto;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

  }


  const botonElemento =
    document.getElementById(
      boton
    );


  /* Animación */

  botonElemento
    .classList
    .add("animando");


  setTimeout(() => {

    botonElemento
      .classList
      .remove("animando");

  }, 600);


  botonElemento
    .classList
    .add("copiado");


  const textoOriginal =
    botonElemento.innerHTML;


  botonElemento.innerHTML =
    "✓ ¡Copiado!";


  document.getElementById(
    "mensaje"
  ).textContent =
    "✓ Copiado al portapapeles";


  setTimeout(() => {

    botonElemento
      .classList
      .remove("copiado");

    botonElemento.innerHTML =
      textoOriginal;

    document.getElementById(
      "mensaje"
    ).textContent = "";

  }, 1800);

}


/* ==========================================
   GENERAR QR
   ========================================== */

function generarQR() {

  const paginaActual =
    window.location.href;


  const qrURL =
    "https://api.qrserver.com/v1/create-qr-code/"
    + "?size=300x300&data="
    + encodeURIComponent(
        paginaActual
      );


  document.getElementById(
    "qrImagen"
  ).src = qrURL;

}


/* ==========================================
   INICIO
   ========================================== */

cambiarTarjeta();

</script>

</body>
</html>
